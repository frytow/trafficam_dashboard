<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="apple-touch-icon" sizes="76x76" href="../img/apple-icon.png">
  <link rel="icon" type="image/png" href="../img/traficam_logo_net_only_logo.png">
  <title>
    control center
  </title>
  <!-- Fonts and icons -->
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,900" />
  <!-- my style -->
  <link rel="stylesheet" type="text/css" href="../css/my_css/tables_page_style.css">
  <!-- Nucleo Icons -->
  <link href="../css/nucleo-icons.css" rel="stylesheet" />
  <link href="../css/nucleo-svg.css" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
  <!-- Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <!-- CSS Files -->
  <link id="pagestyle" href="../css/material-dashboard.css?v=3.2.0" rel="stylesheet" />
  <!-- Open Street Map Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .main-content {
      margin-left: 75px; 
    }
    .card {
      max-width: 80%; 
      margin: 0 auto; 
    }
    .table-responsive {
      max-height: 65vh; 
      overflow-y: auto; 
      position: relative; 
    }
    .table-responsive thead th {
      position: sticky; 
      top: 0; 
      background: #fff; 
      z-index: 1; 
    }
    .table-responsive::-webkit-scrollbar {
      width: 8px;
    }
    .table-responsive::-webkit-scrollbar-thumb {
      background: #888; 
      border-radius: 4px;
    }
    .table-responsive::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>

<body class="g-sidenav-show bg-gray-100">
  <!----------------------- Side Menu ------------------------>
  <aside class="sidenav navbar navbar-vertical navbar-expand-xs border-radius-0 ms-0 bg-white my-0" id="sidenav-main" style="width: 75px;">
    <div class="sidenav-header">
      <i class="fas fa-times p-3 cursor-pointer text-dark opacity-5 position-absolute end-0 top-0 d-none d-xl-none" aria-hidden="true" id="iconSidenav"></i>
      <a class="navbar-brand p-2 m-2 d-flex justify-content-center" href="#" target="_blank">
        <img src="../img/traficam_logo_net.png" class="navbar-brand-img" width="40" height="40" alt="main_logo">
      </a>
    </div>
    <hr class="horizontal dark mt-0 mb-2 mx-2">
    <div class="collapse navbar-collapse w-auto" id="sidenav-collapse-main">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link text-dark p-3 d-flex justify-content-center" title="dashboard" href="../pages/dashboard.html">
            <i class="material-symbols-rounded opacity-5">dashboard</i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active bg-gradient-dark text-white p-3 d-flex justify-content-center" title="data base" href="../pages/tables.html">
            <i class="material-symbols-rounded opacity-5">table_view</i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark p-3 d-flex justify-content-center" title="Statistics" href="../pages/statistiques.html">
            <i class="material-symbols-rounded opacity-5">show_chart</i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark p-3 d-flex justify-content-center" title="notifications" href="../pages/notifications.html">
            <i class="material-symbols-rounded opacity-5">notifications</i>
          </a>
        </li>
      </ul>
    </div>
  </aside>

  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg mt-4">
    <div class="container-fluid py-2">
      <div class="row">
        <div class="col-12">
          <div class="card my-4">
            <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
              <div class="bg-gradient-dark shadow-dark border-radius-lg pt-4 pb-3">
                <h6 class="text-white text-capitalize ps-3">Equipped intersections</h6>
              </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center px-3 py-3">
              <div class="d-flex align-items-stretch">
                <div class="pe-2">  
                  <select id="governorateSelect" class="form-select form-select-sm border-radius-lg" aria-label="governorate" style="height: calc(1.8125rem + 8px);">
                    <option selected>Tunis</option>
                    <option value="Manouba">Manouba</option>
                    <option value="Ben Arous">Ben Arous</option>
                    <option value="Nabeul">Nabeul</option>
                    <option value="Benzart">Benzart</option>
                    <option value="Sousse">Sousse</option>
                    <option value="Sfax">Sfax</option>
                  </select>
                </div>
                <button id="filterBtn" class="btn btn-sm bg-gradient-dark px-3" style="height: calc(1.8125rem + 8px);">
                  <i class="fas fa-filter me-1"></i> Filter
                </button>
              </div>
              <div class="d-flex align-items-stretch">
                <button id="editBtn" class="btn btn-sm bg-gradient-primary px-3 me-2" style="height: calc(1.8125rem + 8px);" disabled>
                  <i class="fas fa-edit me-1"></i> Edit node
                </button>
                <button id="deleteBtn" class="btn btn-sm bg-gradient-danger px-3" style="height: calc(1.8125rem + 8px);" disabled>
                  <i class="fas fa-trash me-1"></i> Delete node
                </button>
              </div>
            </div>            
              
            <div class="card-body px-0 pb-2">
              <div class="table-responsive p-0">
                <table class="table align-items-center mb-0" id="intersectionsTable">
                  <thead>
                    <tr>
                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Address</th>
                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">Latitude</th>
                      <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Longitude</th>
                      <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Cams</th>
                      <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Capacity</th>
                      <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Lanes</th>
                    </tr>
                  </thead>
                  <tbody>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteConfirmModalLabel">Confirm Deletion</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete the node at <span id="deleteAddress"></span>?
            This action cannot be undone.
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Intersection Modal -->
    <div class="modal fade" id="editIntersectionModal" tabindex="-1" aria-labelledby="editIntersectionModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editIntersectionModalLabel">Edit Intersection</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="editIntersectionForm">
              <div class="mb-3">
                <label for="editAddress" class="form-label">Address</label>
                <input type="text" class="form-control" id="editAddress" required maxlength="55">
              </div>
              <div class="mb-3">
                <label for="editCapacity" class="form-label">Capacity</label>
                <input type="number" class="form-control" id="editCapacity" required min="0">
              </div>
              <div class="mb-3">
                <label class="form-label">Location</label>
                <div id="editMap" style="height: 300px;"></div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="editLatitude" class="form-label">Latitude</label>
                  <input type="number" class="form-control" id="editLatitude" step="any" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="editLongitude" class="form-label">Longitude</label>
                  <input type="number" class="form-control" id="editLongitude" step="any" required>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="confirmEditBtn">Save Changes</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <!-- Core JS Files -->
  <script src="../js/core/popper.min.js"></script>
  <script src="../js/core/bootstrap.min.js"></script>
  <script src="../js/plugins/perfect-scrollbar.min.js"></script>
  <script src="../js/plugins/smooth-scrollbar.min.js"></script>
  <script src="../js/my_scripts/tables_script.js"></script>
  <script>
    var win = navigator.platform.indexOf('Win') > -1;
    if (win && document.querySelector('#sidenav-scrollbar')) {
      var options = {
        damping: '0.5'
      }
      Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
    }
  </script>
  <!-- Github buttons -->
  <script async defer src="https://buttons.github.io/buttons.js"></script>
  <script src="../js/material-dashboard.min.js?v=3.2.0"></script>
</body>
</html>
