<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intersections • TraficCam</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/my_css/main_style.css" />

  <style>
      .search-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-wrapper input {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 7px 14px 7px 36px;
    font-size: 13px;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrapper input:focus {
    border-color: var(--accent);
  }

  .search-icon {
    position: absolute;
    left: 11px;
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- SIDEBAR (same as dashboard) -->
  <aside class="sidebar">
    <div>
      <img id="logo_img"  src="../img/logo_dark_theme.png" width="40" height="40" alt="main_logo">
    </div>

    <a class="nav-item" title="Dashboard" href="../pages/dashboard.html"><i class="fa-solid fa-table-cells-large"></i></a>
    <a class="nav-item active" title="Database" href="../pages/tables.html"><i class="fa-solid fa-database"></i></a>
    <a class="nav-item" title="Statistics" href="../pages/statistiques.html"><i class="fa-solid fa-chart-line"></i></a>
    <a class="nav-item" title="Notifications" href="../pages/notifications.html"><i class="fa-solid fa-bell"></i></a>

    <div class="sidebar-spacer"></div>
    
    <!-- Theme Toggle -->
    <div class="theme-toggle" id="themeToggle" title="Toggle Light / Dark">
      <i class="fa-solid fa-sun"></i>
    </div>

    <div class="sidebar-dot" title="System Online"></div>
    <a class="nav-item" title="Settings" href="#"><i class="fa-solid fa-gear"></i></a>
  </aside>

  <!-- APP BODY -->
  <div class="app-body">
    <!-- TOPBAR (same style, no weather) -->
    <header class="topbar">
      <span style="color:var(--muted);font-size:11px;">Control Center — Database</span>

      <div class="topbar-right">
        <div class="clock-display">
          <span id="live-clock">--:--:--</span>
        </div>
      </div>
    </header>

    <!-- YOUR ORIGINAL TABLE CONTENT -->
    <div class="workspace" style="padding: 24px; overflow: auto;">
      <div style="max-width: 1400px; margin: 0 auto;">
        
        <div class="panel-head" style="margin-bottom: 20px;">
          <div class="panel-head-title">Equipped Intersections</div>
          <div class="panel-head-sub">Manage traffic nodes and camera locations</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="d-flex align-items-center gap-3">
            <select id="governorateSelect" class="gov-select">
              <option selected value="Tunis">Tunis</option>
              <option value="Manouba">Manouba</option>
              <option value="Ben Arous">Ben Arous</option>
              <option value="Nabeul">Nabeul</option>
              <option value="Benzart">Benzart</option>
              <option value="Sousse">Sousse</option>
              <option value="Sfax">Sfax</option>
            </select>
            <button id="filterBtn" class="btn-action btn-stats">
              <i class="fas fa-filter"></i> Filter
            </button>
            <div class="search-wrapper">
              <i class="fas fa-search search-icon"></i>
              <input type="text" id="addressSearch" placeholder="Search by address…" autocomplete="off">
            </div>
          </div>
          
          <div class="d-flex gap-2">
            <button id="editBtn" class="btn-action btn-stats" disabled>
              <i class="fas fa-edit"></i> Edit Node
            </button>
            <button id="deleteBtn" class="btn-action btn-stats" style="color: var(--accent2);" disabled>
              <i class="fas fa-trash"></i> Delete Node
            </button>
          </div>
        </div>

        <div class="table-container">
          <table class="custom-table" id="intersectionsTable">
            <thead>
              <tr>
                <th>Address</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th class="text-center">Cameras</th>
                <th class="text-center">Capacity</th>
                <th class="text-center">Lanes</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  </div>

  <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteConfirmModalLabel">Confirm Deletion</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete the node at <span id="deleteAddress"></span>?
            This action cannot be undone.
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Intersection Modal -->
    <div class="modal fade" id="editIntersectionModal" tabindex="-1" aria-labelledby="editIntersectionModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editIntersectionModalLabel">Edit Intersection</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="editIntersectionForm">
              <div class="mb-3">
                <label for="editAddress" class="form-label">Address</label>
                <input type="text" class="form-control" id="editAddress" required maxlength="55">
              </div>
              <div class="mb-3">
                <label for="editCapacity" class="form-label">Capacity</label>
                <input type="number" class="form-control" id="editCapacity" required min="0">
              </div>
              <div class="mb-3">
                <label class="form-label">Location</label>
                <div id="editMap" style="height: 300px;"></div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="editLatitude" class="form-label">Latitude</label>
                  <input type="number" class="form-control" id="editLatitude" step="any" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="editLongitude" class="form-label">Longitude</label>
                  <input type="number" class="form-control" id="editLongitude" step="any" required>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="confirmEditBtn">Save Changes</button>
          </div>
        </div>
      </div>
    </div>

  <script src="../js/my_scripts/theme.js"></script>
  <script src="../js/my_scripts/global_incident_alerts.js"></script>
  <script src="../js/my_scripts/tables_script.js"></script>

  <!-- Clock -->
  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString('en-GB', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
