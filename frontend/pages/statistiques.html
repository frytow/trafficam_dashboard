<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="apple-touch-icon" sizes="76x76" href="../assets/img/apple-icon.png">
  <link rel="icon" type="image/png" href="../img/traficam_logo_net_only_logo.png">
  <title>
    General Statistics
  </title>
  <!-- My style -->
  <link rel="stylesheet" type="text/css" href="../css/my_css/style_my_style.css">
  <!-- Fonts and icons -->
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,900" />
  <!-- Nucleo Icons -->
  <link href="../css/nucleo-icons.css" rel="stylesheet" />
  <link href="../css/nucleo-svg.css" rel="stylesheet" />
  <!-- Open Street Map Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Font Awesome Icons -->
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
  <!-- Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <!-- CSS Files -->
  <link id="pagestyle" href="../css/material-dashboard.css?v=3.2.0" rel="stylesheet" />
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js -->
  <script src="../js/plugins/chartjs.min.js"></script>
</head>

<body class="g-sidenav-show bg-gray-100">
  <!-- Side Menu -->
  <aside class="sidenav navbar navbar-vertical navbar-expand-xs border-radius-0 ms-0 bg-white my-0" id="sidenav-main" style="width: 75px;">
    <div class="sidenav-header">
      <i class="fas fa-times p-3 cursor-pointer text-dark opacity-5 position-absolute end-0 top-0 d-none d-xl-none" aria-hidden="true" id="iconSidenav"></i>
      <a class="navbar-brand p-2 m-2 d-flex justify-content-center" href="#" target="_blank">
        <img src="../img/traficam_logo_net.png" class="navbar-brand-img" width="40" height="40" alt="main_logo">
      </a>
    </div>
    <hr class="horizontal dark mt-0 mb-2 mx-2">
    <div class="collapse navbar-collapse w-auto" id="sidenav-collapse-main">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link text-dark p-3 d-flex justify-content-center" title="dashboard" href="../pages/dashboard.html">
            <i class="material-symbols-rounded opacity-5">dashboard</i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark p-3 d-flex justify-content-center" title="data base" href="../pages/tables.html">
            <i class="material-symbols-rounded opacity-5">table_view</i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active bg-gradient-dark text-white p-3 d-flex justify-content-center" title="Statistics" href="../pages/statistics.html">
            <i class="material-symbols-rounded opacity-5">show_chart</i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark p-3 d-flex justify-content-center" title="notifications" href="../pages/notifications.html">
            <i class="material-symbols-rounded opacity-5">notifications</i>
          </a>
        </li>
      </ul>
    </div>
  </aside>

  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    <div class="container-fluid py-4">
      <div class="container">
        <div class="row mb-4">
          <div class="col-12">
            <div class="card">
              <div class="card-header pb-0">
                <div class="d-flex justify-content-between align-items-center">
                  <h6>General Traffic Statistics</h6>
                  <div class="pe-2" style="width: 150px;">
                    <select id="governorateSelect" class="form-select form-select-sm border-radius-lg" aria-label="governorate">
                      <option value="" disabled>Select Governorate</option>
                      <option value="Tunis" selected>Tunis</option>
                      <option value="Manouba">Manouba</option>
                      <option value="Ben Arous">Ben Arous</option>
                      <option value="Nabeul">Nabeul</option>
                      <option value="Benzart">Benzart</option>
                      <option value="Sousse">Sousse</option>
                      <option value="Sfax">Sfax</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="card-body p-3">
                <div class="row">
                  <div class="col-lg-6">
                    <!-- Heat Traffic Times -->
                    <div class="card mb-4">
                      <div class="card-header pb-0">
                        <h6>Heat Traffic Times</h6>
                        <p class="text-sm">Most frequent times for traffic congestion</p>
                      </div>
                      <div class="card-body">
                        <div class="chart" style="max-width: 600px; margin: auto;">
                          <canvas id="congestion-times-chart" class="chart-canvas" height="200"></canvas>
                        </div>
                      </div>
                    </div>

                    <!-- Heat Traffic Areas -->
                    <div class="card">
                      <div class="card-header pb-0">
                        <h6>Heat Traffic Areas</h6>
                        <p class="text-sm">Most congested intersections during peak times</p>
                      </div>
                      <div class="card-body">
                        <div id="congestion-areas" class="list-group">
                          <!-- Congested areas will be injected here -->
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-lg-6">
                    <div class="card h-100">
                      <div class="card-header pb-0">
                        <h6>Congestion Map</h6>
                        <p class="text-sm">Visualizing congested areas</p>
                      </div>
                      <div class="card-body p-0">
                        <div id="congestion-map" style="height: 600px;"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Core JS Files -->
  <script src="../js/core/popper.min.js"></script>
  <script src="../js/core/bootstrap.min.js"></script>
  <script src="../js/plugins/perfect-scrollbar.min.js"></script>
  <script src="../js/plugins/smooth-scrollbar.min.js"></script>
  <script src="../js/plugins/chartjs.min.js"></script>
  <script src="../js/my_scripts/statistics.js"></script>

  <script>
    var win = navigator.platform.indexOf('Win') > -1;
    if (win && document.querySelector('#sidenav-scrollbar')) {
      var options = {
        damping: '0.5'
      }
      Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
    }
  </script>

  <!-- Github buttons -->
  <script async defer src="https://buttons.github.io/buttons.js"></script>
  <script src="../js/material-dashboard.min.js?v=3.2.0"></script>
</body>

</html>
