<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistics • TraficCam</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="../js/plugins/chartjs.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <img id="logo_img"  src="../img/logo_dark_theme.png" width="40" height="40" alt="main_logo">
    </div>

    <a class="nav-item" title="Dashboard" href="../pages/dashboard.html"><i class="fa-solid fa-table-cells-large"></i></a>
    <a class="nav-item" title="Database" href="../pages/tables.html"><i class="fa-solid fa-database"></i></a>
    <a class="nav-item active" title="Statistics" href="../pages/statistiques.html"><i class="fa-solid fa-chart-line"></i></a>
    <a class="nav-item" title="Notifications" href="../pages/notifications.html"><i class="fa-solid fa-bell"></i></a>

    <div class="sidebar-spacer"></div>
    
    <div class="theme-toggle" id="themeToggle" title="Toggle Light / Dark">
      <i class="fa-solid fa-sun"></i>
    </div>

    <div class="sidebar-dot" title="System Online"></div>
    <a class="nav-item" title="Settings" href="#"><i class="fa-solid fa-gear"></i></a>
  </aside>

  <!-- APP BODY -->
  <div class="app-body">
    <header class="topbar">
      <span class="status-badge">System Live</span>
      <div class="topbar-sep"></div>
      <span style="color:var(--muted);font-size:11px;">Control Center — Statistics</span>

      <div class="topbar-right">
        <select id="governorateSelect" class="gov-select">
          <option value="Tunis" selected>Tunis</option>
          <option value="Manouba">Manouba</option>
          <option value="Ben Arous">Ben Arous</option>
          <option value="Nabeul">Nabeul</option>
          <option value="Benzart">Benzart</option>
          <option value="Sousse">Sousse</option>
          <option value="Sfax">Sfax</option>
        </select>
        <div class="clock-display">
          <span id="live-clock">--:--:--</span>
        </div>
      </div>
    </header>

    <div class="workspace" style="padding: 24px; overflow: auto;">
      <div style="max-width: 1480px; margin: 0 auto;">
        <div class="panel-head" style="margin-bottom: 20px;">
          <div class="panel-head-title">General Traffic Statistics</div>
          <div class="panel-head-sub">Congestion analysis and heat map</div>
        </div>

        <div class="row">
          <div class="col-lg-7">
            <div class="stat-card" style="margin-bottom: 24px; padding: 24px;">
              <div style="margin-bottom: 16px;">
                <div class="panel-head-title" style="font-size: 17px;">Heat Traffic Times</div>
                <p class="panel-head-sub">Most frequent times for traffic congestion</p>
              </div>
              <div style="height: 360px;">
                <canvas id="congestion-times-chart"></canvas>
              </div>
            </div>

            <div class="stat-card" style="padding: 24px;">
              <div style="margin-bottom: 16px;">
                <div class="panel-head-title" style="font-size: 17px;">Heat Traffic Areas</div>
                <p class="panel-head-sub">Most congested intersections</p>
              </div>
              <div id="congestion-areas" class="list-group"></div>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="stat-card" style="height: 720px; padding: 24px;">
              <div style="margin-bottom: 16px;">
                <div class="panel-head-title" style="font-size: 17px;">Congestion Map</div>
                <p class="panel-head-sub">Visualizing congested areas</p>
              </div>
              <div id="congestion-map" style="height: 620px; border-radius: 12px; overflow: hidden;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="../js/my_scripts/statistics.js"></script>

  <!-- Clock -->
  <script>
    function updateClock() {
      document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('en-GB', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
